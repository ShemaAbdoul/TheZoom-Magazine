<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issues | The Zoom Magazine</title>
<meta name="description" content="Read the latest issue of The Zoom Magazine online, or buy a digital copy or print edition.">
<meta name="theme-color" content="#2540ff">
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Newsreader:opsz,wght@6..72,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a class="logo" href="index.html" aria-label="The Zoom Magazine, home">The Z<span class="o"></span><span class="o"></span>m</a>
  <nav><a href="index.html#stories">Stories</a><a href="issues.html" aria-current="page">Issues</a><a href="about.html">About</a><button class="theme" id="theme" role="switch" aria-checked="false" aria-label="Dark mode"></button></nav>
</header>

<main>
  <section class="wrap latest" id="latest"></section>
  <section class="wrap" id="archive">
    <h2>Past issues</h2>
    <p class="imeta">Read online, buy a digital copy, or order the print edition.</p>
    <div class="shelf" id="shelf"></div>
  </section>
</main>

<footer class="wrap">
  <span>&copy; <span id="year">2026</span> The Zoom Magazine</span>
  <span><a href="index.html">Back to the magazine</a> &middot; <a href="about.html#contact">Contact</a></span>
</footer>

<dialog id="viewer" aria-labelledby="vt">
  <div class="vbar"><span id="vt"></span><span><a class="btn" id="vo" target="_blank" rel="noopener">Open in new tab</a><button class="btn" id="vc">Close</button></span></div>
  <iframe id="vf" title="Magazine reader"></iframe>
</dialog>

<dialog id="order" aria-labelledby="ot">
  <form id="oform" class="cform" novalidate>
    <h2 id="ot">Order</h2>
    <p class="imeta" id="os"></p>
    <div class="field"><label for="oname">Your name</label><input id="oname" autocomplete="name"></div>
    <div class="field"><label for="oemail">Email address</label><input id="oemail" type="email" autocomplete="email"></div>
    <div class="field" data-print hidden><label for="oqty">Copies</label><input id="oqty" type="number" min="1" max="10" value="1"></div>
    <div class="field" data-print hidden><label for="oaddr">Delivery address</label><textarea id="oaddr"></textarea></div>
    <button type="submit">Send order request</button><button type="button" class="alt" id="oc">Cancel</button>
    <p id="onote" role="status"></p>
  </form>
</dialog>
<script src="issues.js"></script>
</body>
</html>
